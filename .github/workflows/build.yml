name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/YOUR_ACCOUNT/YOUR_IMAGE:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf /root/.buildozer

      - name: Show Versions
        run: |
          python --version
          pip --version
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edenshore-apk
          path: |
            bin/*.apk
