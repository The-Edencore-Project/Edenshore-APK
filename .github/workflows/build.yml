name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-buildozer -f Dockerfile.buildozer .

      - name: Build APK
        run: |
          docker run --rm \
            -w /home/user/hostcwd \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            my-buildozer \
            bash -c "
              rm -rf .buildozer &&
              pip install 'pip<24' &&
              yes y | buildozer android debug
            "

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edenshore-apk
          path: |
            bin/*.apk
